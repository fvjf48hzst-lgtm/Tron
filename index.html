/* =========================================================

/* =========================================================

   ========================================================= */

#gameWrapper {

    position: relative;

    /*
        The arena is always square and uses the smaller
        available screen dimension.

        stays completely inside the usable phone screen.

    width:
        min(
            calc(
                94vw
                - env(safe-area-inset-left)

    flex: 0 0 auto;

    justify-content: center;
    align-items: center;
}

/* Dynamic viewport for modern mobile browsers */
@supports (height: 100dvh) {

}

<body>

<div id="gameWrapper">

    <!-- =====================================================
         GAME ARENA
         ===================================================== -->

    <canvas id="gameCanvas"></canvas>

    <!-- =====================================================

    <div id="hud">

        </div>

    </div>

    </div>

    </div>

    </div>

    <!-- =====================================================

         ===================================================== -->

    <div id="startMenu">

        <div id="startBox">

            <h1 id="tronTitle">
                TRON
            </h1>

            <div id="subtitle">

            </div>

            <button
                class="menuButton"
                id="startButton"
            >
                START GAME
            </button>

        </div>

    </div>

    <!-- =====================================================
         PAUSE MENU
         ===================================================== -->

    <div id="pauseMenu">

            </p>

            </div>

            </div>

            <button
                class="menuButton"
                id="gameOverRestartButton"
            >

            </button>

            <button
                class="menuButton"
                id="gameOverMainMenuButton"
            >

            </button>

    <!-- =====================================================

         ===================================================== -->

        <div id="messageText"></div>

    </div>

</div>

<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");

const pauseButton =
    document.getElementById(
        "pauseButton"
    );

const pauseMenu =
    document.getElementById(
        "pauseMenu"
    );

const resumeButton =
    document.getElementById(
        "resumeButton"
    );

const pauseRestartButton =
    document.getElementById(
        "pauseRestartButton"
    );

const pauseMainMenuButton =
    document.getElementById(
        "pauseMainMenuButton"
    );

const startMenu =
    document.getElementById(
        "startMenu"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const gameOverMenu =
    document.getElementById(
        "gameOverMenu"
    );

const gameOverRestartButton =
    document.getElementById(
        "gameOverRestartButton"
    );

const gameOverMainMenuButton =
    document.getElementById(
        "gameOverMainMenuButton"
    );

const finalTime =
    document.getElementById(
        "finalTime"
    );

const deathReason =
    document.getElementById(
        "deathReason"
    );

const stopwatch =
    document.getElementById(
        "stopwatch"
    );

const laserStatus =
    document.getElementById(
        "laserStatus"
    );

const enemyStatus =
    document.getElementById(
        "enemyStatus"
    );

/* =========================================================
   GAME SETTINGS
   ========================================================= */

const GRID_SIZE = 25;

const SWIPE_DISTANCE = 25;

const TRIPLE_TAP_TIME = 500;

const ENEMY_TRAIL_MIN_TIME = 0.7;

const ENEMY_TRAIL_MAX_TIME = 2.8;

const ENEMY_LOOK_AHEAD = 5.0;

const ENEMY_SIDE_CHECK = 1.1;

/* =========================================================
   GAME STATE
   ========================================================= */

let canvasSize = 0;

let cellSize = 0;

let gameRunning = false;

let gameOver = false;

let gameStarted = false;

let survivalTime = 0;

let laserActive = false;

let playerTrail = [];

let enemyTrailActive = true;

let enemyTrail = [];

let enemyTrailTimer = 0;

/* =========================================================
   TOUCH STATE
   ========================================================= */

let pointerDown = false;

let pointerStartX = 0;

let pointerStartY = 0;

let tapCount = 0;

let tapTimer = null;

/* =========================================================
   CYCLES
   ========================================================= */

const player = {

    x: 3,

    y: 12,

    dir: {
        x: 1,
        y: 0
    },

    speed: 7.5
};

const enemy = {

    x: 21,

    y: 12,

    dir: {
        x: -1,
        y: 0
    },

    speed: 6.5
};

let lastTime =
    performance.now();

/* =========================================================
   CANVAS RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(
            rect.width,
            rect.height
        );

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.round(
            size * dpr
        );

    canvas.height =
        Math.round(
            size * dpr
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    canvasSize =
        size;

    cellSize =
        canvasSize /
        GRID_SIZE;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            resizeCanvas,
            100
        );

    }
);

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        resizeCanvas
    );
}

if (
    "ResizeObserver" in window
) {

    const resizeObserver =
        new ResizeObserver(
            resizeCanvas
        );

    resizeObserver.observe(
        document.getElementById(
            "gameWrapper"
        )
    );
}

resizeCanvas();

/* =========================================================
   RANDOM
   ========================================================= */

function randomRange(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}

/* =========================================================
   ENEMY TRAIL TIMER
   ========================================================= */

function setEnemyTrailTimer() {

    enemyTrailTimer =
        randomRange(
            ENEMY_TRAIL_MIN_TIME,
            ENEMY_TRAIL_MAX_TIME
        );
}

/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame() {

    player.x = 3;

    player.y = 12;

    player.dir = {
        x: 1,
        y: 0
    };

    enemy.x = 21;

    enemy.y = 12;

    enemy.dir = {
        x: -1,
        y: 0
    };

    playerTrail = [];

    laserActive = false;

    enemyTrailActive = true;

    enemyTrail = [

        {
            x: enemy.x,
            y: enemy.y
        }

    ];

    setEnemyTrailTimer();

    survivalTime = 0;

    gameRunning = true;

    gameOver = false;

    gameStarted = true;

    startMenu.style.display =
        "none";

    pauseMenu.style.display =
        "none";

    gameOverMenu.style.display =
        "none";

    tapCount = 0;

    if (tapTimer) {

        clearTimeout(
            tapTimer
        );

        tapTimer = null;
    }

    updateBackgroundMode();

    updateHUD();

    lastTime =
        performance.now();
}

/* =========================================================
   MAIN MENU
   ========================================================= */

function showMainMenu() {

    gameRunning = false;

    gameOver = false;

    gameStarted = false;

    pauseMenu.style.display =
        "none";

    gameOverMenu.style.display =
        "none";

    startMenu.style.display =
        "flex";

    document.body.classList.remove(
        "redMode"
    );

    canvas.classList.remove(
        "redMode"
    );

    survivalTime = 0;

    updateHUD();
}

/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    resetGame();

    startMenu.style.display =
        "none";

    lastTime =
        performance.now();
}

startButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        startGame();

    }
);

/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    const totalHundredths =
        Math.floor(
            survivalTime * 100
        );

    const minutes =
        Math.floor(
            totalHundredths / 6000
        );

    const seconds =
        Math.floor(
            (totalHundredths % 6000) /
            100
        );

    const hundredths =
        totalHundredths % 100;

    stopwatch.textContent =

        String(minutes).padStart(
            2,
            "0"
        )

        + ":"

        + String(seconds).padStart(
            2,
            "0"
        )

        + "."

        + String(hundredths).padStart(
            2,
            "0"
        );

    laserStatus.textContent =

        laserActive
            ? "LASER ACTIVE"
            : "LASER OFF";

    enemyStatus.textContent =

        enemyTrailActive
            ? "RED TRAIL ON"
            : "RED TRAIL OFF";
}

/* =========================================================
   BACKGROUND
   ========================================================= */

function updateBackgroundMode() {

    const redMode =
        survivalTime >= 30 &&
        survivalTime < 60;

    document.body.classList.toggle(
        "redMode",
        redMode
    );

    canvas.classList.toggle(
        "redMode",
        redMode
    );
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function changeDirection(
    dx,
    dy
) {

    if (
        !gameRunning ||
        gameOver
    ) {

        return;
    }

    if (
        dx === -player.dir.x &&
        dy === -player.dir.y
    ) {

        return;
    }

    player.dir = {
        x: dx,
        y: dy
    };
}

function moveCycle(
    cycle,
    dt
) {

    cycle.x +=
        cycle.dir.x *
        cycle.speed *
        dt;

    cycle.y +=
        cycle.dir.y *
        cycle.speed *
        dt;
}

/* =========================================================
   TRAILS
   ========================================================= */

function updatePlayerTrail() {

    if (!laserActive) {

        return;
    }

    const last =
        playerTrail[
            playerTrail.length - 1
        ];

    if (
        !last ||
        Math.hypot(
            player.x - last.x,
            player.y - last.y
        ) > 0.08
    ) {

        playerTrail.push({

            x: player.x,

            y: player.y

        });
    }
}

function updateEnemyTrail(
    dt
) {

    enemyTrailTimer -= dt;

    if (
        enemyTrailTimer <= 0
    ) {

        enemyTrailActive =
            !enemyTrailActive;

        if (enemyTrailActive) {

            enemyTrail = [

                {
                    x: enemy.x,
                    y: enemy.y
                }

            ];

        } else {

            enemyTrail = [];
        }

        setEnemyTrailTimer();
    }

    if (enemyTrailActive) {

        const last =
            enemyTrail[
                enemyTrail.length - 1
            ];

        if (
            !last ||
            Math.hypot(
                enemy.x - last.x,
                enemy.y - last.y
            ) > 0.08
        ) {

            enemyTrail.push({

                x: enemy.x,

                y: enemy.y

            });
        }
    }
}

/* =========================================================
   COLLISION HELPERS
   ========================================================= */

function checkWallCollision(
    cycle
) {

    return (

        cycle.x < 0 ||

        cycle.x >= GRID_SIZE ||

        cycle.y < 0 ||

        cycle.y >= GRID_SIZE

    );
}

function pointToSegmentDistance(
    px,
    py,
    ax,
    ay,
    bx,
    by
) {

    const abx =
        bx - ax;

    const aby =
        by - ay;

    const apx =
        px - ax;

    const apy =
        py - ay;

    const abLengthSquared =
        abx * abx +
        aby * aby;

    if (
        abLengthSquared === 0
    ) {

        return Math.hypot(
            px - ax,
            py - ay
        );
    }

    let t =

        (
            apx * abx +
            apy * aby
        ) /
        abLengthSquared;

    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );

    const closestX =
        ax + abx * t;

    const closestY =
        ay + aby * t;

    return Math.hypot(
        px - closestX,
        py - closestY
    );
}

function checkTrailCollision(
    cycle,
    trail
) {

    if (
        !trail ||
        trail.length < 2
    ) {

        return false;
    }

    const end =
        Math.max(
            0,
            trail.length - 5
        );

    for (
        let i = 0;
        i < end - 1;
        i++
    ) {

        const a =
            trail[i];

        const b =
            trail[i + 1];

        if (
            pointToSegmentDistance(
                cycle.x,
                cycle.y,
                a.x,
                a.y,
                b.x,
                b.y
            ) < 0.32
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   COLLISIONS
   ========================================================= */

function checkCollisions() {

    if (
        checkWallCollision(
            player
        )
    ) {

        endGame(
            "YOU CRASHED!"
        );

        return true;
    }

    if (
        checkWallCollision(
            enemy
        )
    ) {

        endGame(
            "RED CYCLE CRASHED!"
        );

        return true;
    }

    if (
        laserActive &&
        playerTrail.length >= 2
    ) {

        if (
            checkTrailCollision(
                player,
                playerTrail
            )
        ) {

            endGame(
                "YOU HIT THE BLUE TRAIL!"
            );

            return true;
        }

        if (
            checkTrailCollision(
                enemy,
                playerTrail
            )
        ) {

            endGame(
                "RED CYCLE HIT THE BLUE TRAIL!"
            );

            return true;
        }
    }

    if (
        enemyTrailActive &&
        enemyTrail.length >= 2
    ) {

        if (
            checkTrailCollision(
                player,
                enemyTrail
            )
        ) {

            endGame(
                "YOU HIT THE RED TRAIL!"
            );

            return true;
        }

        if (
            checkTrailCollision(
                enemy,
                enemyTrail
            )
        ) {

            endGame(
                "RED CYCLE HIT ITS TRAIL!"
            );

            return true;
        }
    }

    return false;
}

/* =========================================================
   SMART ENEMY AI
   ========================================================= */

function isPositionDangerous(
    x,
    y
) {

    if (
        x < 0.8 ||
        x > GRID_SIZE - 0.8 ||
        y < 0.8 ||
        y > GRID_SIZE - 0.8
    ) {

        return true;
    }

    if (
        checkTrailCollision(
            { x, y },
            playerTrail
        )
    ) {

        return true;
    }

    if (
        checkTrailCollision(
            { x, y },
            enemyTrail
        )
    ) {

        return true;
    }

    return false;
}

function directionHasDanger(
    direction,
    distance
) {

    const steps = 10;

    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const progress =
            distance *
            (i / steps);

        const x =
            enemy.x +
            direction.x *
            progress;

        const y =
            enemy.y +
            direction.y *
            progress;

        if (
            isPositionDangerous(
                x,
                y
            )
        ) {

            return true;
        }
    }

    return false;
}

function countOpenDirections(
    x,
    y
) {

    let open = 0;

    const directions = [

        { x: 1, y: 0 },

        { x: -1, y: 0 },

        { x: 0, y: 1 },

        { x: 0, y: -1 }

    ];

    for (
        const d of directions
    ) {

        if (
            d.x === -enemy.dir.x &&
            d.y === -enemy.dir.y
        ) {

            continue;
        }

        const testX =
            x + d.x * 1.5;

        const testY =
            y + d.y * 1.5;

        if (
            !isPositionDangerous(
                testX,
                testY
            )
        ) {

            open++;
        }
    }

    return open;
}

function enemyAI() {

    const directions = [

        { x: 1, y: 0 },

        { x: -1, y: 0 },

        { x: 0, y: 1 },

        { x: 0, y: -1 }

    ];

    const candidates = [];

    for (
        const direction of directions
    ) {

        if (
            direction.x === -enemy.dir.x &&
            direction.y === -enemy.dir.y
        ) {

            continue;
        }

        if (
            directionHasDanger(
                direction,
                ENEMY_LOOK_AHEAD
            )
        ) {

            continue;
        }

        let sideDanger = false;

        const sideX =
            -direction.y *
            ENEMY_SIDE_CHECK;

        const sideY =
            direction.x *
            ENEMY_SIDE_CHECK;

        for (
            let distance = 1;
            distance <= 4;
            distance++
        ) {

            const forwardX =
                enemy.x +
                direction.x *
                distance;

            const forwardY =
                enemy.y +
                direction.y *
                distance;

            if (

                isPositionDangerous(
                    forwardX + sideX,
                    forwardY + sideY
                )

                ||

                isPositionDangerous(
                    forwardX - sideX,
                    forwardY - sideY
                )

            ) {

                sideDanger = true;

                break;
            }
        }

        let score = 0;

        if (
            direction.x === enemy.dir.x &&
            direction.y === enemy.dir.y
        ) {

            score += 8;
        }

        const openSpace =
            countOpenDirections(
                enemy.x +
                direction.x * 2,

                enemy.y +
                direction.y * 2
            );

        score +=
            openSpace * 5;

        if (sideDanger) {

            score -= 10;
        }

        for (
            let distance = 1;
            distance <= 4;
            distance++
        ) {

            const checkX =
                enemy.x +
                direction.x *
                distance;

            const checkY =
                enemy.y +
                direction.y *
                distance;

            if (
                isPositionDangerous(
                    checkX,
                    checkY
                )
            ) {

                score -= 100;
            }
        }

        const futureX =
            enemy.x +
            direction.x * 5;

        const futureY =
            enemy.y +
            direction.y * 5;

        const distanceToPlayer =

            Math.abs(
                futureX - player.x
            )

            +

            Math.abs(
                futureY - player.y
            );

        score +=

            Math.max(
                0,
                12 - distanceToPlayer
            )

            * 0.35;

        candidates.push({

            direction,

            score

        });
    }

    if (
        candidates.length > 0
    ) {

        candidates.sort(
            (a, b) =>
                b.score - a.score
        );

        const bestScore =
            candidates[0].score;

        const goodChoices =
            candidates.filter(
                candidate =>
                    candidate.score >=
                    bestScore - 4
            );

        const choice =
            goodChoices[
                Math.floor(
                    Math.random() *
                    goodChoices.length
                )
            ];

        enemy.dir =
            choice.direction;

        return;
    }

    let emergencyChoice = null;

    let emergencyScore =
        -Infinity;

    for (
        const direction of directions
    ) {

        if (
            direction.x === -enemy.dir.x &&
            direction.y === -enemy.dir.y
        ) {

            continue;
        }

        let score = 0;

        for (
            let distance = 0.5;
            distance <= 3;
            distance += 0.5
        ) {

            const x =
                enemy.x +
                direction.x *
                distance;

            const y =
                enemy.y +
                direction.y *
                distance;

            if (

                x < 0.5 ||

                x > GRID_SIZE - 0.5 ||

                y < 0.5 ||

                y > GRID_SIZE - 0.5

            ) {

                score -= 20;

            }

            else if (
                isPositionDangerous(
                    x,
                    y
                )
            ) {

                score -= 15;

            }

            else {

                score += 3;
            }
        }

        if (
            score >
            emergencyScore
        ) {

            emergencyScore =
                score;

            emergencyChoice =
                direction;
        }
    }

    if (emergencyChoice) {

        enemy.dir =
            emergencyChoice;
    }
}

/* =========================================================
   DRAWING
   ========================================================= */

function drawGrid() {

    ctx.save();

    ctx.strokeStyle =

        document.body.classList.contains(
            "redMode"
        )

        ?

        "rgba(255, 50, 30, 0.12)"

        :

        "rgba(0, 110, 255, 0.12)";

    ctx.lineWidth = 1;

    for (
        let i = 0;
        i <= GRID_SIZE;
        i++
    ) {

        const p =
            i * cellSize;

        ctx.beginPath();

        ctx.moveTo(
            p,
            0
        );

        ctx.lineTo(
            p,
            canvasSize
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            p
        );

        ctx.lineTo(
            canvasSize,
            p
        );

        ctx.stroke();
    }

    ctx.restore();
}

function drawTrail(
    trail,
    color
) {

    if (
        !trail ||
        trail.length < 2
    ) {

        return;
    }

    ctx.save();

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        16;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        Math.max(
            3,
            cellSize * 0.25
        );

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x *
            cellSize,

        trail[0].y *
            cellSize
    );

    for (
        let i = 1;
        i < trail.length;
        i++
    ) {

        ctx.lineTo(
            trail[i].x *
                cellSize,

            trail[i].y *
                cellSize
        );
    }

    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        Math.max(
            1,
            cellSize * 0.07
        );

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x *
            cellSize,

        trail[0].y *
            cellSize
    );

    for (
        let i = 1;
        i < trail.length;
        i++
    ) {

        ctx.lineTo(
            trail[i].x *
                cellSize,

            trail[i].y *
                cellSize
        );
    }

    ctx.stroke();

    ctx.restore();
}

function drawCycle(
    cycle,
    mainColor,
    darkColor
) {

    const x =
        cycle.x *
        cellSize;

    const y =
        cycle.y *
        cellSize;

    const angle =
        Math.atan2(
            cycle.dir.y,
            cycle.dir.x
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle
    );

    ctx.shadowColor =
        mainColor;

    ctx.shadowBlur =
        18;

    ctx.fillStyle =
        darkColor;

    ctx.fillRect(

        -cellSize * 0.55,

        -cellSize * 0.22,

        cellSize * 1.1,

        cellSize * 0.44

    );

    ctx.fillStyle =
        mainColor;

    ctx.fillRect(

        -cellSize * 0.58,

        -cellSize * 0.12,

        cellSize * 1.16,

        cellSize * 0.24

    );

    ctx.fillRect(

        cellSize * 0.32,

        -cellSize * 0.25,

        cellSize * 0.28,

        cellSize * 0.5

    );

    ctx.restore();
}

function draw() {

    ctx.clearRect(

        0,
        0,
        canvasSize,
        canvasSize

    );

    drawGrid();

    if (laserActive) {

        drawTrail(
            playerTrail,
            "#00c8ff"
        );
    }

    if (enemyTrailActive) {

        drawTrail(
            enemyTrail,
            "#ff2222"
        );
    }

    drawCycle(

        player,

        "#00c8ff",

        "#00141f"

    );

    drawCycle(

        enemy,

        "#ff2222",

        "#200000"

    );
}

/* =========================================================
   LASER
   ========================================================= */

function toggleLaser() {

    if (
        !gameRunning ||
        gameOver
    ) {

        return;
    }

    laserActive =
        !laserActive;

    if (laserActive) {

        playerTrail = [

            {
                x: player.x,
                y: player.y
            }

        ];

    } else {

        playerTrail = [];
    }

    updateHUD();
}

/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(
    message
) {

    if (gameOver) {

        return;
    }

    gameOver = true;

    gameRunning = false;

    deathReason.textContent =
        message;

    finalTime.textContent =
        stopwatch.textContent;

    gameOverMenu.style.display =
        "flex";
}

/* =========================================================
   PAUSE
   ========================================================= */

function togglePause() {

    if (
        !gameStarted ||
        gameOver
    ) {

        return;
    }

    if (gameRunning) {

        gameRunning = false;

        pauseMenu.style.display =
            "flex";

    } else {

        gameRunning = true;

        pauseMenu.style.display =
            "none";

        lastTime =
            performance.now();
    }
}

pauseButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

    }
);

pauseButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        event.stopPropagation();

        togglePause();

    }
);

resumeButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        if (
            gameStarted &&
            !gameOver
        ) {

            gameRunning = true;

            pauseMenu.style.display =
                "none";

            lastTime =
                performance.now();
        }

    }
);

pauseRestartButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        resetGame();

    }
);

pauseMainMenuButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        showMainMenu();

    }
);

/* =========================================================
   GAME OVER BUTTONS
   ========================================================= */

gameOverRestartButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        resetGame();

    }
);

gameOverMainMenuButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        showMainMenu();

    }
);

/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                "#startMenu, #pauseButton, #pauseMenu, #gameOverMenu"
            )
        ) {

            pointerDown = false;

            return;
        }

        if (
            !gameStarted ||
            !gameRunning ||
            gameOver
        ) {

            pointerDown = false;

            return;
        }

        pointerDown = true;

        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;

    },
    {
        passive: false
    }
);

document.addEventListener(
    "pointerup",
    event => {

        if (
            event.target.closest(
                "#startMenu, #pauseButton, #pauseMenu, #gameOverMenu"
            )
        ) {

            pointerDown = false;

            return;
        }

        if (!pointerDown) {

            return;
        }

        pointerDown = false;

        const dx =
            event.clientX -
            pointerStartX;

        const dy =
            event.clientY -
            pointerStartY;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        /* =================================================
           SWIPE
           ================================================= */

        if (
            distance >=
            SWIPE_DISTANCE
        ) {

            tapCount = 0;

            if (tapTimer) {

                clearTimeout(
                    tapTimer
                );

                tapTimer = null;
            }

            if (
                !gameRunning ||
                gameOver
            ) {

                return;
            }

            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                if (dx > 0) {

                    changeDirection(
                        1,
                        0
                    );

                } else {

                    changeDirection(
                        -1,
                        0
                    );
                }

            } else {

                if (dy > 0) {

                    changeDirection(
                        0,
                        1
                    );

                } else {

                    changeDirection(
                        0,
                        -1
                    );
                }
            }

            return;
        }

        /* =================================================
           TAP
           ================================================= */

        if (
            !gameRunning ||
            gameOver
        ) {

            return;
        }

        tapCount++;

        if (
            tapCount === 1
        ) {

            if (tapTimer) {

                clearTimeout(
                    tapTimer
                );
            }

            tapTimer =
                setTimeout(
                    () => {

                        tapCount = 0;

                        tapTimer = null;

                    },
                    TRIPLE_TAP_TIME
                );
        }

        /* =================================================
           TRIPLE TAP = LASER
           ================================================= */

        if (
            tapCount === 3
        ) {

            if (tapTimer) {

                clearTimeout(
                    tapTimer
                );

                tapTimer = null;
            }

            tapCount = 0;

            toggleLaser();
        }

    },
    {
        passive: false
    }
);

/* =========================================================
   PREVENT PAGE SCROLLING
   ========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        if (
            event.target.closest(
                "#startMenu, #pauseButton, #pauseMenu, #gameOverMenu"
            )
        ) {

            return;
        }

        event.preventDefault();

    },
    {
        passive: false
    }
);

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            key === "enter" &&
            !gameStarted
        ) {

            startGame();

            return;
        }

        if (
            event.key === "ArrowUp" ||
            key === "w"
        ) {

            changeDirection(
                0,
                -1
            );
        }

        if (
            event.key === "ArrowDown" ||
            key === "s"
        ) {

            changeDirection(
                0,
                1
            );
        }

        if (
            event.key === "ArrowLeft" ||
            key === "a"
        ) {

            changeDirection(
                -1,
                0
            );
        }

        if (
            event.key === "ArrowRight" ||
            key === "d"
        ) {

            changeDirection(
                1,
                0
            );
        }

        if (
            event.key === " " ||
            key === "p"
        ) {

            event.preventDefault();

            togglePause();
        }

        if (
            key === "l"
        ) {

            toggleLaser();
        }

    }
);

/* =========================================================
   GAME LOOP
   ========================================================= */

function update(
    dt
) {

    if (
        !gameRunning ||
        gameOver
    ) {

        return;
    }

    survivalTime += dt;

    moveCycle(
        player,
        dt
    );

    moveCycle(
        enemy,
        dt
    );

    updatePlayerTrail();

    updateEnemyTrail(
        dt
    );

    enemyAI();

    checkCollisions();

    updateBackgroundMode();

    updateHUD();
}

function gameLoop(
    now
) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            0.05
        );

    lastTime = now;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

/* =========================================================
   INITIAL STATE
   ========================================================= */

showMainMenu();

requestAnimationFrame(
    gameLoop
);

</script>
